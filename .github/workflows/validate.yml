name: Validate public snapshot
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published repository files
        run: python3 scripts/case_data.py verify-snapshot --json
      - name: Run release and downloader tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run provenance example
        run: python3 examples/summarize_case.py > /tmp/youngcrc-summary.json
      - name: Reproduce immune-evasion analysis tables
        run: python3 analysis/immune-evasion/2026-11-14/verify_package.py --rerun
  immunotherapy-numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preserved historical compact package integrity
        run: python3 analysis/immunotherapy-resistance/2026-11-16/verify_package.py
      - name: Verify preserved17November package integrity
        run: python3 analysis/immunotherapy-resistance/2026-11-17/verify_package.py
      - name: Verify compact package integrity
        run: python3 analysis/immunotherapy-resistance/2026-11-17-smad4/verify_package.py
      - name: Install pinned numerical dependencies
        run: python3 -m pip install -r analysis/immunotherapy-resistance/2026-11-17-smad4/requirements.txt
      - name: Reproduce immunotherapy-resistance numerical tables
        run: python3 analysis/immunotherapy-resistance/2026-11-17-smad4/verify_package.py --rerun
  vactosertib-methods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require complete reviewed trial package and report
        run: python3 analysis/vactosertib-pathways/2026-11-17/scripts/verify_package.py --require-final
      - name: Install pinned numerical dependencies
        run: python3 -m pip install -r analysis/vactosertib-pathways/2026-11-17/requirements.txt
      - name: Check statistics with independent synthetic fixtures
        run: |
          python3 analysis/vactosertib-pathways/2026-11-17/tests/test_statistics_synthetic.py
          python3 analysis/vactosertib-pathways/2026-11-17/analysis/independent_verify_final_statistics.py --self-test
          python3 analysis/vactosertib-pathways/2026-11-17/scripts/check_primary_from_unlinked_figure.py
      - name: Confirm tests preserve sealed source integrity
        run: python3 analysis/vactosertib-pathways/2026-11-17/scripts/verify_package.py --require-final
  vaccine-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed report, inherited hashes and deterministic source assembly
        run: python3 analysis/immunotherapy-resistance/2026-11-18-vaccine/verify_package.py --require-final --require-repository-dependencies --rerun
